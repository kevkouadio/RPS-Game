<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissors</title>
</head>

<body>
    <header class="game-header">
        <h1 class="game-title">
            <span class="title-rock">Rock</span>
            <span class="title-sep" aria-hidden="true">·</span>
            <span class="title-paper">Paper</span>
            <span class="title-sep" aria-hidden="true">·</span>
            <span class="title-scissors">Scissors</span>
        </h1>
        <p class="game-subtitle">First to win the most rounds in 10 plays</p>
    </header>

    <main class="game-container">
        <section class="scoreboard" aria-label="Scoreboard">
            <div class="scoreboard-grid">
                <article class="score-card score-card--player">
                    <p class="score-label">You</p>
                    <p class="p-count score-value" aria-live="polite">0</p>
                </article>
                <article class="score-card score-card--computer">
                    <p class="score-label">Computer</p>
                    <p class="c-count score-value" aria-live="polite">0</p>
                </article>
            </div>
            <div class="rounds-track">
                <div class="rounds-meta">
                    <span class="movesleft" aria-live="polite">Round 0 of 10</span>
                </div>
                <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </section>

        <section class="arena" aria-label="Game board">
            <div class="versus comp-display">
                <article class="fighter fighter--player">
                    <h2 class="fighter-label">Your move</h2>
                    <div id="player-choice" class="fighter-display player-choice-display" aria-live="polite">
                        <span class="fighter-placeholder">?</span>
                    </div>
                </article>

                <div class="vs-badge" aria-hidden="true">VS</div>

                <article class="fighter fighter--computer">
                    <h2 class="fighter-label">Computer</h2>
                    <div id="computer-choice" class="fighter-display computer-choice-display" aria-live="polite">
                        <span class="fighter-placeholder">?</span>
                    </div>
                </article>
            </div>

            <div class="round-result" hidden aria-live="polite"></div>

            <button type="button" class="play btn-action" hidden>Play next round</button>
        </section>

        <section class="choices-panel" aria-label="Choose your move">
            <p class="move">Pick rock, paper, or scissors</p>
            <div class="options" role="group" aria-label="Choose rock, paper, or scissors">
                <button type="button" class="choice-btn" value="rock" aria-label="Rock">
                    <img src="assets/rock.png" alt="">
                    <span>Rock</span>
                </button>
                <button type="button" class="choice-btn" value="paper" aria-label="Paper">
                    <img src="assets/paper.png" alt="">
                    <span>Paper</span>
                </button>
                <button type="button" class="choice-btn" value="scissors" aria-label="Scissors">
                    <img src="assets/scissors.png" alt="">
                    <span>Scissors</span>
                </button>
            </div>
        </section>

        <button type="button" class="reload btn-action btn-action--success" hidden>Play again</button>
    </main>

    <script src="scripts.js"></script>
</body>

</html>
